;============================================================
; Selection Translator - configuration file (config.ini)
; Edit via the "Settings..." item in the tray menu (applies on save), or edit by hand and click "Reload config".
; Note: API keys are NOT stored here. Put the DeepL key in secret.txt and the Microsoft key in secret_microsoft.txt (the Settings window has an "Edit Key" button).
;============================================================

[UI]
; UI language: auto = follow Windows display language   zh = Simplified Chinese   en = English
language=auto

[Setup]
; Records whether the first-run wizard has been shown (informational only). It opens once, on a fresh install without config.ini; the "Setup wizard..." tray item opens it any time.
completed=1

[API]
; Free plan uses api-free.deepl.com; Pro plan uses api.deepl.com
api_url=https://api-free.deepl.com/v2/translate

[Lang]
; Target language code (the language to translate into)
;   ZH = Simplified Chinese   EN = English   JA = Japanese   KO = Korean
; Source language: leave empty to auto-detect. Text already in the target language is translated the other way:
; to the source language if one is set, otherwise to English (to Chinese when the target is English)
target_lang=ZH
source_lang=
; "Translate to" list of the input window: empty = automatic, or a fixed language code
input_target=

[Hotkey]
; Trigger hotkey: press it after selecting text to open the translation window
; AHK syntax: ^ = Ctrl   + = Shift   x = the X key
trigger=^+x

[Behavior]
; Popup position: cursor = beside the selected text (right, else below, left, above; keeps off the selection)   center = middle of the screen
window_position=cursor
; Show the "Copy translation" button on the popup  1 = show  0 = hide
show_copy_button=1
; Show tray notification bubbles (startup, pause/resume, saving settings, etc.)  1 = show  0 = off
show_tray_tips=1
; Copy text automatically when it is selected with the mouse in the translation  1 = on  0 = off
copy_on_select=1
; Maximum text length before truncation (characters)
max_chars=5000
; Request timeout in milliseconds, default 10000
network_timeout=10000

[Engine]
; Translation engine: ecdict = offline dictionary   hy = Hy-MT2 local model   microsoft = Microsoft Translator   deepl = DeepL
; 1-4 selected English words use the word engine, anything else uses the sentence engine (sentence cannot be ecdict)
; On engine failure the popup shows the specific reason (only ECDICT can switch automatically, via ecdict_fallback below)
word=ecdict
sentence=hy
; Engine to switch to when ECDICT fails (word not in the dictionary or dictionary missing): none = no switch, show the error   hy / microsoft / deepl
ecdict_fallback=none

[Hy]
; Load mode: idle = load on first use, unload after idle_minutes of inactivity
;           startup = stay loaded from program start   first = stay loaded after first use
load_mode=idle
idle_minutes=10
; llama.cpp server program and model file (relative to this folder, or an absolute path)
server=llama\llama-server.exe
model=models\Hy-MT2-1.8B-Q6_K.gguf
; Local port (listens on 127.0.0.1 only); change it if it conflicts with another program
port=18080
; Number of layers to offload to the graphics card; 99 = all, 0 = CPU only (slower)
gpu_layers=99
; Vulkan engine only: which device to use. Empty = the engine decides, cpu = CPU only, or a device id such as Vulkan0.
; Set it with Settings -> Hy-MT2 -> Speed test; device_name is only the text shown there
device=
device_name=

[Microsoft]
; Region of the Azure Translator resource (e.g. eastasia; leave empty if the resource location is Global). The key is not stored here; see secret_microsoft.txt
region=

[Dict]
; Show phonetic transcription  1 = show  0 = hide
show_phonetic=1
; Show word forms (plural, past tense, etc.)  1 = show  0 = hide
show_forms=1
; Show field-specific senses such as [医] [计] [网络]  1 = show  0 = hide (still shown when an entry has only field senses)
show_domain=0
; Maximum number of senses to show; 0 = all
max_senses=0
